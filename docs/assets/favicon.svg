<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nabz">
  <title>Nabz</title>
  <!--
    The same pulse as logo.svg, cropped to the QRS complex alone.

    At 16px a full trace turns to mud, so the flat baseline and the trailing
    beat are dropped and only the spike survives — which is the part anyone
    recognises anyway. Stroke is heavier than the wordmark's for the same
    reason: thin lines disappear in a browser tab.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0f766e"/>
  <path d="M4 19 h4.5 l2 -1 2.5 6 4 -14.5 3.5 18 2.5 -8.5 2 1.5 H28"
        fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
