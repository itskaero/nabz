<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 60" role="img"
     aria-label="Nabz — bilingual clinical prescriptions">
  <title>Nabz</title>
  <!--
    Nabz is نبض, "pulse". So the mark is a pulse, and a real one: a single QRS
    complex rather than the decorative sawtooth most health logos settle for.
    The trace runs flat, dips to Q, spikes to R, drops to S and settles.

    The Urdu is OUTLINES, not text. Set as a text element it fell back to a
    serif on any machine without Noto Nastaliq installed, which is most of
    them, and a wrong-font Urdu in the logo of an app whose entire claim is
    correct Urdu is not a small thing. These paths came out of the app's own
    HarfBuzz shaper, so the joins are the ones the renderer itself would draw.

    This is the variant for dark backgrounds. The teal is lifted two steps:
    the app's #0f766e is chosen to sit on white paper and goes muddy on
    near-black, where it reads as grey rather than as the brand colour.
  -->
  <defs>
    <linearGradient id="nabz-pulse-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.6" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <path d="M6 34 H19 l4 -1.4 2.8 8.4 5.2 -25 4.7 32 3.8 -15 3.3 1.4 H55"
        fill="none" stroke="url(#nabz-pulse-dark)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="66" y="43" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="33" font-weight="600" letter-spacing="-0.6" fill="#f1f5f9">Nabz</text>

